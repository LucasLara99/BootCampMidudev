<!DOCTYPE html>

<head>
  <title>DevJobs - Empleos</title>
  <meta charset="UTF-8" />
  <meta name="description" content="Página de resultados de búsqueda" />
  <link rel="stylesheet" href="./empleos.css" />
  <link rel="icon" type="image/png" href="./assets/favicon.jpg">
  <script type="module">
    import React from "https://esm.sh/react?dev";
    import ReactDOM from "https://esm.sh/react-dom/client?dev";

    window.React = React;
    window.ReactDOM = ReactDOM;
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    function JobCard({ data, titulo, empresa, ubicacion, descripcion }) {
      return (
        <article
          className="job-listing-card"
          data-modalidad={data?.modalidad}
          data-technology={data?.technology}
          data-nivel={data?.nivel}
        >
          <aside>
            <h3>{titulo}</h3>
            <small>{empresa} | {ubicacion}</small>
            <p class="description">{descripcion}</p>
          </aside>
          <button className="job-listing-button">Aplicar</button>
        </article>
      )
    }

    function App() {
      return (
        <div className="job-listings">
          <JobCard
            titulo="Diseñador UX/UI"
            empresa="Creative Minds Studio"
            ubicacion="Remoto"
            descripcion="Se busca un administrador de bases de datos con experiencia en PostgreSQL y MySQL. El candidato deberá asegurar la disponibilidad, seguridad y rendimiento de las bases de datos de producción." />
        </div>
      )
    }
    const rootEl = document.querySelector('#root');
    const root = ReactDOM.createRoot(rootEl);
    root.render(<App />)
  </script>
</head>

<body>
  <header>
    <div>
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="#1173d4"
        class="icon icon-tabler icons-tabler-filled icon-tabler-briefcase-2">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path
          d="M14 2a3 3 0 0 1 3 3v1h2a3 3 0 0 1 3 3v9a3 3 0 0 1 -3 3h-14a3 3 0 0 1 -3 -3v-9a3 3 0 0 1 3 -3h2v-1a3 3 0 0 1 3 -3zm0 2h-4a1 1 0 0 0 -1 1v1h6v-1a1 1 0 0 0 -1 -1" />
      </svg>
      <h2>DevJobs</h2>
      <nav>
        <a href="./index.html">Inicio</a>
        <a href="">Empleos</a>
      </nav>
    </div>
    <div>
      <devjobs-avatar service="github" username="LucasLara99" size="40"></devjobs-avatar>
    </div>
  </header>
  <main>
    <section class="hero-section">
      <h2>React.js primeros pasos</h2>
      <div id="root"></div>
    </section>
  </main>
  <footer>
    <small>&copy; 2025 Lucas Lara. Todos los derechos reservados</small>
  </footer>
</body>
