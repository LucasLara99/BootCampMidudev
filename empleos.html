<!DOCTYPE html>

<head>
  <title>DevJobs - Búsquedas</title>
  <meta charset="UTF-8" />
  <meta name="description" content="Página de resultados de búsqueda" />
  <link rel="stylesheet" href="./empleos.css" />
  <script type="module" src="./fetch-data.js"></script>
  <script type="module" src="./filters.js"></script>
  <script type="module" src="./apply-button.js"></script>
</head>

<body>
  <header>
    <div>
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="#1173d4"
        class="icon icon-tabler icons-tabler-filled icon-tabler-briefcase-2">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path
          d="M14 2a3 3 0 0 1 3 3v1h2a3 3 0 0 1 3 3v9a3 3 0 0 1 -3 3h-14a3 3 0 0 1 -3 -3v-9a3 3 0 0 1 3 -3h2v-1a3 3 0 0 1 3 -3zm0 2h-4a1 1 0 0 0 -1 1v1h6v-1a1 1 0 0 0 -1 -1" />
      </svg>
      <h2>DevJobs</h2>
      <nav>
        <a href="./index.html">Inicio</a>
        <a href="">Empleos</a>
      </nav>
    </div>
    <div>
      <a href="">Subir CV</a>
      <img src="./avatar.webp" />
    </div>
  </header>
  <main>
    <section class="hero-section">
      <h2>Encuentra tu próximo trabajo</h2>
      <p>Explora miles de oportunidades en el sector tecnológico</p>
      <form role="search">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-search">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
          <path d="M21 21l-6 -6" />
        </svg>
        <input type="text" placeholder="Buscar empleos por título, habilidad o empresa">
      </form>
      <div class="filters-container">
        <!-- <label for="filter-technology">Tecnología</label> -->
        <select name="technology" id="technology-filter">
          <option value="">Tecnologías</option>
          <hr />
          <optgroup label="Frontend">
            <option value="JavaScript">JavaScript</option>
            <option value="React">React</option>
          </optgroup>
          <hr />
          <optgroup label="Backend">
            <option value="Python">Python</option>
            <option value="SQL">SQL</option>
          </optgroup>
          <hr />
          <option value="Swift">Swift</option>
          <option value="Kotlin">Kotlin</option>
          <option value="AWS">AWS</option>
        </select>
        <!-- <label for="filter-location">Ubicación</label> -->
        <select name="location" id="location-filter">
          <option value="">Todas las ubicaciones</option>
          <hr>
          <optgroup label="México">
            <option value="cdmx">Ciudad de México</option>
            <option value="guadalajara">Guadalajara</option>
          </optgroup>
          <hr>
          <option value="remoto">Remoto</option>
        </select>
        <!-- <label for="filter-experience">Experiencia</label> -->
        <select name="experience" id="experience-filter">
          <option value="">Nivel de experiencia</option>
          <hr />
          <option value="1-3">1-3 años</option>
          <option value="2-5">2-5 años</option>
          <option value="+5">+5 años</option>
        </select>
      </div>
    </section>
    <h2 class="job-list-title">Resultados de búsqueda</h2>
    <section class="job-listings">
    </section>
  </main>
  <footer>
    <small>&copy; 2025 Lucas Lara. Todos los derechos reservados</small>
  </footer>
</body>
